<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analysis App</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 50px;
        }

        .container{
            width: 50%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        textarea{
            width: 90%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
        }

        button{
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #0056b3;
        }

        .positive{
            color: green;
        }

        .negative{
            color: red;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Sentiment Analysis of Reviews</h1>

        <form method="POST">

            <textarea
                name="review"
                rows="6"
                placeholder="Enter your review here..."
                required
            ></textarea>

            <br>

            <button type="submit">Analyze Sentiment</button>

        </form>

        {% if prediction %}

            <h2 class="{{ prediction.lower() }}">

                Sentiment: {{ prediction }}

            </h2>

            <h3>

                Confidence: {{ confidence }}%

            </h3>

        {% endif %}

    </div>

</body>

</html>
